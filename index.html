<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>送迎ルート管理</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        /* Modern CSS Reset & Variables */
        :root {
            --bg-color: #f0f2f5;
            --surface-color: #ffffff;
            --primary-color: #0f172a;
            --primary-hover: #1e293b;
            --accent-color: #3b82f6;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --nav-height: 70px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-user-select: none;
            user-select: none;
            padding-bottom: calc(var(--nav-height) + 20px);
        }

        /* Layout & Bento UI */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header { padding: 8px 0 4px; }
        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }

        /* Inputs & Controls */
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-group:last-child { margin-bottom: 0; }

        input[type="text"] {
            flex: 1; appearance: none; border: 1px solid var(--border-color);
            background-color: #f8fafc; border-radius: var(--radius-md); padding: 12px 14px;
            font-size: 1rem; color: var(--text-main); transition: all 0.2s ease; width: 100%;
        }
        input[type="text"]:focus {
            outline: none; border-color: var(--accent-color); background-color: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        button {
            border: none; font-family: inherit; cursor: pointer; border-radius: var(--radius-md);
            transition: transform 0.1s, background-color 0.2s; font-weight: 600;
            display: inline-flex; align-items: center; justify-content: center;
        }
        button:active { transform: scale(0.96); }

        .btn-primary { background-color: var(--primary-color); color: white; padding: 12px 16px; }
        .btn-secondary { background-color: #f1f5f9; color: var(--text-main); padding: 8px 12px; font-size: 0.85rem; border: 1px solid var(--border-color); }
        .btn-text { background: transparent; color: var(--accent-color); padding: 4px 8px; font-size: 0.85rem; }

        /* Lists & Items */
        .list-container { display: flex; flex-direction: column; gap: 10px; min-height: 80px; }

        #userPool { flex-direction: row; flex-wrap: wrap; padding: 12px; background-color: #e2e8f0; border-radius: var(--radius-lg); }

        .route-item {
            background-color: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: var(--radius-md); padding: 12px 16px; display: flex; align-items: center;
            justify-content: space-between; box-shadow: var(--shadow-sm); width: 100%;
        }
        
        #userPool .route-item { width: auto; flex: 1 1 140px; padding: 10px 12px; box-shadow: none; }
        #userPool .route-item .address, #userPool .route-item .drag-handle { display: none !important; }

        .route-item.sortable-drag { background: var(--surface-color); transform: scale(1.02); box-shadow: var(--shadow-lg); z-index: 100; }
        .route-item.sortable-ghost { opacity: 0.4; background-color: #f8fafc; border: 2px dashed var(--border-color); }

        .item-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; padding-right: 8px; }
        .item-name { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .item-address { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .item-actions { display: flex; align-items: center; gap: 4px; }
        .btn-icon { width: 36px; height: 36px; border-radius: var(--radius-md); background: #f8fafc; color: var(--text-muted); font-size: 1.1rem; }
        
        .drag-handle { color: var(--border-color); padding: 8px; cursor: grab; display: flex; }
        .drag-handle svg { width: 20px; height: 20px; fill: currentColor; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height);
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around;
            align-items: center; padding: 0 8px; padding-bottom: env(safe-area-inset-bottom); z-index: 50;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: transparent; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; border-radius: 0; }
        .nav-item.active { color: var(--accent-color); }
        .nav-indicator { width: 4px; height: 4px; border-radius: 50%; background-color: transparent; margin-top: 4px; }
        .nav-item.active .nav-indicator { background-color: var(--accent-color); }

        /* Floating Action Button (FAB) */
        .fab {
            position: fixed; right: 20px; bottom: calc(var(--nav-height) + 20px); width: 60px; height: 60px;
            border-radius: var(--radius-full); background-color: var(--primary-color); color: white;
            box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; z-index: 40;
        }
        .fab svg { width: 24px; height: 24px; fill: white; }

        /* Modern Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--surface-color); width: 90%; max-width: 360px; border-radius: var(--radius-lg);
            padding: 24px; box-shadow: var(--shadow-lg); transform: translateY(10px); transition: transform 0.2s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
        .modal-body { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
        .modal-data-box { background: #f8fafc; padding: 12px; border-radius: var(--radius-md); margin-top: 12px; color: var(--text-main); font-weight: 500; word-break: break-all;}
        
        .modal-actions { display: flex; gap: 12px; }
        .modal-btn { flex: 1; padding: 12px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>ルート管理</h1>
        </header>

        <!-- 起点・登録カード -->
        <div class="card">
            <div class="section-header">
                <span class="section-title">起点と新規登録</span>
            </div>
            <div class="input-group">
                <input type="text" id="originInput" placeholder="出発地点（現在地を取得または入力）">
                <button type="button" class="btn-secondary" onclick="fetchLocation()">GPS</button>
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <input type="text" id="newName" placeholder="氏名" style="flex: 1;">
                <input type="text" id="newAddress" placeholder="住所" style="flex: 1.5;">
                <button type="button" class="btn-primary" id="addBtn" style="padding: 12px;">追加</button>
            </div>
        </div>

        <!-- 待機リスト -->
        <div>
            <div class="section-header">
                <span class="section-title">利用者リスト（待機）</span>
            </div>
            <div id="userPool" class="list-container"></div>
        </div>

        <!-- 送迎ルート -->
        <div>
            <div class="section-header">
                <span class="section-title">本日のルート</span>
                <button type="button" class="btn-text" onclick="returnAll()">すべて待機に戻す</button>
            </div>
            <div id="routeList" class="list-container"></div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="mapBtn" aria-label="マップを開く">
        <svg viewBox="0 0 576 512"><path d="M408 120c0-13.3-10.7-24-24-24H96c-13.3 0-24 10.7-24 24v296c0 13.3 10.7 24 24 24h288c13.3 0 24-10.7 24-24V120zm160 80.9L416 339v93c0 17.8-19.2 29.1-34.7 20.5l-104.5-59L194.5 452.5C179.2 461.1 160 449.8 160 432v-93L8 200.9c-14.7-8.6-8.3-30.9 8.9-30.9h155.1l48.8-40c10.9-8.9 27.1-8.9 38 0l48.8 40h155.1c17.2 0 23.6 22.3 8.9 30.9z"/></svg>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-day="mon" onclick="switchDay('mon')">月<div class="nav-indicator"></div></button>
        <button class="nav-item" data-day="tue" onclick="switchDay('tue')">火<div class="nav-indicator"></div></button>
        <button class="nav-item" data-day="wed" onclick="switchDay('wed')">水<div class="nav-indicator"></div></button>
        <button class="nav-item" data-day="thu" onclick="switchDay('thu')">木<div class="nav-indicator"></div></button>
        <button class="nav-item" data-day="fri" onclick="switchDay('fri')">金<div class="nav-indicator"></div></button>
        <button class="nav-item" data-day="sat" onclick="switchDay('sat')">土<div class="nav-indicator"></div></button>
    </nav>

    <!-- Modern Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title">マップを起動します</div>
            <div class="modal-body">
                以下の順番でGoogleマップの経路案内を作成します。
                <div class="modal-data-box" id="modalFlowText"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary modal-btn" onclick="toggleModal(false)">キャンセル</button>
                <button type="button" class="btn-primary modal-btn" id="executeMapBtn">ナビ開始</button>
            </div>
        </div>
    </div>

    <script>
        const APP_VERSION = 'v14_modern';
        const $ = id => document.getElementById(id);
        
        // ユーティリティ: HTMLエスケープ（XSS対策）
        const escapeHTML = str => {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, match => {
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return escapeMap[match];
            });
        };

        const extractData = container => Array.from(container.querySelectorAll('.route-item')).map(item => ({ name: item.dataset.name, address: item.dataset.address }));
        
        let currentDay = 'mon';
        let store = {
            mon: { origin: '', pool: [], route: [] },
            tue: { origin: '', pool: [], route: [] },
            wed: { origin: '', pool: [], route: [] },
            thu: { origin: '', pool: [], route: [] },
            fri: { origin: '', pool: [], route: [] },
            sat: { origin: '', pool: [], route: [] }
        };

        const saveState = () => {
            store[currentDay].origin = $('originInput').value;
            store[currentDay].pool = extractData($('userPool'));
            store[currentDay].route = extractData($('routeList'));
            localStorage.setItem('app_version', APP_VERSION);
            localStorage.setItem('app_data', JSON.stringify(store));
            localStorage.setItem('app_day', currentDay);
        };

        const renderUI = () => {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.day === currentDay);
            });
            
            const data = store[currentDay];
            $('originInput').value = data.origin;
            $('userPool').innerHTML = '';
            $('routeList').innerHTML = '';
            
            data.pool.forEach(user => $('userPool').appendChild(createItemElement(user, true)));
            data.route.forEach(user => $('routeList').appendChild(createItemElement(user, false)));
        };

        const switchDay = (day) => {
            saveState();
            currentDay = day;
            renderUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const createItemElement = (user, isPool) => {
            const el = document.createElement('div');
            el.className = 'route-item';
            el.dataset.name = user.name;
            el.dataset.address = user.address;
            
            const iconAdd = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
            const iconRemove = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            const iconTrash = `<svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--danger-color)" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
            const iconDrag = `<svg viewBox="0 0 24 24"><path d="M3 15h18v-2H3v2zm0 4h18v-2H3v2zm0-8h18V9H3v2zm0-6v2h18V5H3z"/></svg>`;

            // XSS対策として入力値をエスケープして展開
            el.innerHTML = `
                <div class="item-info">
                    <span class="item-name">${escapeHTML(user.name)}</span>
                    <span class="item-address address">${escapeHTML(user.address)}</span>
                </div>
                <div class="item-actions">
                    <button type="button" class="btn-icon" onclick="toggleState(this, ${isPool})">
                        ${isPool ? iconAdd : iconRemove}
                    </button>
                    <button type="button" class="btn-icon" onclick="deleteItem(this)">
                        ${iconTrash}
                    </button>
                    ${isPool ? '' : `<div class="drag-handle">${iconDrag}</div>`}
                </div>
            `;
            return el;
        };

        const toggleState = (btn, isPool) => {
            const item = btn.closest('.route-item');
            const user = { name: item.dataset.name, address: item.dataset.address };
            const data = store[currentDay];
            
            if (isPool) {
                data.pool = data.pool.filter(x => x.name !== user.name || x.address !== user.address);
                data.route.push(user);
            } else {
                data.route = data.route.filter(x => x.name !== user.name || x.address !== user.address);
                data.pool.push(user);
            }
            renderUI();
            saveState();
        };

        const deleteItem = (btn) => {
            const item = btn.closest('.route-item');
            if (confirm(`「${item.dataset.name}」を完全に削除しますか？`)) {
                item.remove();
                saveState();
            }
        };

        const fetchLocation = () => {
            if (!navigator.geolocation) return alert('GPS非対応です');
            const input = $('originInput');
            input.value = '取得中...';
            navigator.geolocation.getCurrentPosition(
                pos => { input.value = `${pos.coords.latitude},${pos.coords.longitude}`; saveState(); },
                () => { alert('GPSの取得に失敗しました'); input.value = ''; },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        };

        $('originInput').addEventListener('input', saveState);

        $('addBtn').addEventListener('click', () => {
            const name = $('newName').value.trim();
            const address = $('newAddress').value.trim();
            if (!name || !address) return alert('氏名と住所を入力してください');
            
            store[currentDay].pool.push({ name, address });
            $('newName').value = '';
            $('newAddress').value = '';
            renderUI();
            saveState();
        });

        const returnAll = () => {
            const data = store[currentDay];
            if (!data.route.length) return;
            data.pool.push(...data.route);
            data.route = [];
            renderUI();
            saveState();
        };

        let generatedMapUrl = '';
        const toggleModal = (show) => {
            $('confirmModal').classList.toggle('active', show);
        };

        $('mapBtn').addEventListener('click', () => {
            const items = Array.from(document.querySelectorAll('#routeList .route-item'));
            const addresses = items.map(i => i.dataset.address);
            const names = items.map(i => i.dataset.name);
            const origin = $('originInput').value.trim();

            if (!addresses.length) return alert('ルートに利用者が追加されていません');
            if (!origin) return alert('出発地点を入力してください');

            const originText = origin.includes(',') ? '現在地(GPS)' : origin;
            $('modalFlowText').textContent = `[起点] ${originText} → ` + names.join(' → ');

            let url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(addresses[addresses.length-1])}&travelmode=driving`;
            if (addresses.length > 1) {
                url += `&waypoints=${addresses.slice(0, -1).map(encodeURIComponent).join('|')}`;
            }
            
            generatedMapUrl = url;
            toggleModal(true);
        });

        $('executeMapBtn').addEventListener('click', () => {
            toggleModal(false);
            if (generatedMapUrl) {
                window.open(generatedMapUrl, '_blank', 'noopener,noreferrer');
            }
        });

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            const savedVer = localStorage.getItem('app_version');
            const validDays = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            
            if (savedVer === APP_VERSION && localStorage.getItem('app_data')) {
                try {
                    store = JSON.parse(localStorage.getItem('app_data'));
                    const savedDay = localStorage.getItem('app_day');
                    currentDay = validDays.includes(savedDay) ? savedDay : 'mon';
                } catch(e) { 
                    console.error('Data parsing error'); 
                }
            } else {
                // 修正箇所：localStorage.clear() を廃止し、関連キーのみ削除
                localStorage.removeItem('app_data');
                localStorage.removeItem('app_day');
                localStorage.setItem('app_version', APP_VERSION);
            }
            
            renderUI();

            // 修正箇所：SortableJSのリスト間移動を廃止し、ルート内の順番変更のみに限定
            const sortableOptions = {
                animation: 200,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                delay: 150,
                delayOnTouchOnly: true,
                onEnd: saveState
            };
            
            new Sortable($('routeList'), sortableOptions);
        });
    </script>
</body>
</html>
