<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>送迎ルート管理</title>

<style>

:root{
    --bg:#090d16;
    --card:#131b2e;
    --main:#38bdf8;
    --text:#f8fafc;
    --sub:#94a3b8;
    --border:rgba(255,255,255,.08);
    --danger:#fb7185;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #090d16,
            #1a233a
        );

    color:var(--text);

    min-height:100vh;

    padding-bottom:100px;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:600px;
    margin:auto;
    padding:20px 16px;
}


/* =========================
   ヘッダー
========================= */

header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    object-fit:cover;
}

h1{
    font-size:1.4rem;
}


/* =========================
   カード
========================= */

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
}

.section-title{
    color:var(--sub);
    font-size:.85rem;
    font-weight:bold;
    margin-bottom:12px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}


/* =========================
   入力
========================= */

.row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

input[type="text"]{
    flex:1;
    min-width:0;

    background:rgba(0,0,0,.2);

    color:var(--text);

    border:
        1px solid
        var(--border);

    border-radius:12px;

    padding:12px;
}

input[type="text"]:focus{
    outline:none;
    border-color:var(--main);
}


/* =========================
   曜日
========================= */

.days{
    display:flex;
    gap:5px;
    margin:12px 0;
}

.days label{
    flex:1;
}

.days input{
    display:none;
}

.days span{
    display:block;

    text-align:center;

    padding:9px 0;

    border:
        1px solid
        var(--border);

    border-radius:10px;

    color:var(--sub);
}

.days input:checked + span{
    background:var(--main);
    color:#090d16;
}


/* =========================
   ボタン
========================= */

.primary{
    width:100%;

    background:var(--main);

    color:#090d16;

    border-radius:11px;

    padding:13px;

    font-weight:bold;
}

.secondary{
    background:
        rgba(255,255,255,.06);

    color:var(--text);

    border:
        1px solid
        var(--border);

    border-radius:11px;

    padding:11px 14px;
}

.text-button{
    background:none;

    color:var(--main);

    padding:5px;

    font-weight:bold;
}


/* =========================
   利用者リスト
========================= */

.list{
    display:flex;
    flex-direction:column;
    gap:8px;

    min-height:40px;
}

#userPool{
    flex-direction:row;
    flex-wrap:wrap;

    padding:10px;

    background:
        rgba(0,0,0,.2);

    border-radius:16px;
}

.item{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;

    background:var(--card);

    border:
        1px solid
        var(--border);

    border-radius:12px;

    padding:11px;
}

#userPool .item{
    width:auto;
    flex:1 1 160px;
}

.info{
    min-width:0;
    flex:1;
}

.name{
    display:block;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.address{
    display:block;

    color:var(--sub);

    font-size:.75rem;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    margin-top:2px;
}

.actions{
    display:flex;
    align-items:center;
    gap:5px;
}

.icon{
    width:36px;
    height:36px;

    border-radius:10px;

    background:
        rgba(255,255,255,.06);

    color:var(--text);

    border:
        1px solid
        var(--border);

    font-size:20px;
}

.drag{
    color:var(--sub);
    cursor:grab;
    padding:8px;
}

.empty{
    width:100%;

    text-align:center;

    color:var(--sub);

    padding:15px;

    font-size:.85rem;
}


/* =========================
   マップボタン
========================= */

.map-button{
    position:fixed;

    right:20px;

    bottom:90px;

    width:64px;
    height:64px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #0284c7
        );

    color:#090d16;

    font-size:27px;

    box-shadow:
        0 8px 24px
        rgba(56,189,248,.4);

    z-index:40;
}

.map-button:active{
    transform:scale(.92);
}


/* =========================
   下部ナビ
========================= */

.nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    display:flex;

    background:
        rgba(9,13,22,.96);

    border-top:
        1px solid
        var(--border);

    z-index:30;
}

.nav button{
    flex:1;

    background:none;

    color:var(--sub);

    font-weight:bold;
}

.nav button.active{
    color:var(--main);
}


/* =========================
   モーダル
========================= */

.modal{
    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.75);

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:100;
}

.modal.active{
    opacity:1;

    pointer-events:auto;
}

.modal-box{
    width:90%;
    max-width:400px;

    background:var(--card);

    border:
        1px solid
        var(--border);

    border-radius:18px;

    padding:20px;
}

.modal-title{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:10px;
}

.modal-text{
    color:var(--sub);
    line-height:1.5;
}

.route-preview{
    margin-top:12px;

    padding:12px;

    background:
        rgba(0,0,0,.3);

    border-radius:10px;

    line-height:1.6;

    word-break:break-word;
}

.modal-buttons{
    display:flex;
    gap:8px;

    margin-top:18px;
}

.modal-buttons button{
    flex:1;
}


/* =========================
   PC
========================= */

@media(max-width:500px){

    .row{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <img
        src="koala-icon.jpg"
        class="logo"
        onerror="this.style.display='none'"
    >

    <h1>送迎ルート管理</h1>

</header>


<!-- #region マスター登録 -->

<div class="card">

    <div class="section-title">
        起点と利用者マスター登録
    </div>


    <div class="row">

        <input
            id="originInput"
            type="text"
            placeholder="本日の出発地点"
        >

        <button
            id="gpsButton"
            class="secondary"
            type="button"
        >
            GPS
        </button>

    </div>


    <div class="row">

        <input
            id="newName"
            type="text"
            placeholder="氏名"
        >

        <input
            id="newAddress"
            type="text"
            placeholder="住所"
        >

    </div>


    <div class="days">

        <label>
            <input
                type="checkbox"
                name="regDay"
                value="mon"
            >
            <span>月</span>
        </label>

        <label>
            <input
                type="checkbox"
                name="regDay"
                value="tue"
            >
            <span>火</span>
        </label>

        <label>
            <input
                type="checkbox"
                name="regDay"
                value="wed"
            >
            <span>水</span>
        </label>

        <label>
            <input
                type="checkbox"
                name="regDay"
                value="thu"
            >
            <span>木</span>
        </label>

        <label>
            <input
                type="checkbox"
                name="regDay"
                value="fri"
            >
            <span>金</span>
        </label>

        <label>
            <input
                type="checkbox"
                name="regDay"
                value="sat"
            >
            <span>土</span>
        </label>

    </div>


    <button
        id="addButton"
        class="primary"
        type="button"
    >
        マスターに登録
    </button>

</div>

<!-- #endregion -->


<!-- #region 待機 -->

<div>

    <div class="section-head">

        <div class="section-title">
            本日の利用者（待機）
        </div>

    </div>


    <div
        id="userPool"
        class="list"
    ></div>

</div>

<!-- #endregion -->


<!-- #region ルート -->

<div>

    <div class="section-head">

        <div class="section-title">
            送迎ルート順序
        </div>

        <button
            id="clearRouteButton"
            class="text-button"
            type="button"
        >
            すべて待機に戻す
        </button>

    </div>


    <div
        id="routeList"
        class="list"
    ></div>

</div>

<!-- #endregion -->


</div>


<!-- #region マップボタン -->

<button
    id="mapButton"
    class="map-button"
    type="button"
    aria-label="マップを開く"
>
    ⌖
</button>

<!-- #endregion -->


<!-- #region 曜日 -->

<nav class="nav">

    <button
        type="button"
        data-day="mon"
    >
        月
    </button>

    <button
        type="button"
        data-day="tue"
    >
        火
    </button>

    <button
        type="button"
        data-day="wed"
    >
        水
    </button>

    <button
        type="button"
        data-day="thu"
    >
        木
    </button>

    <button
        type="button"
        data-day="fri"
    >
        金
    </button>

    <button
        type="button"
        data-day="sat"
    >
        土
    </button>

</nav>

<!-- #endregion -->


<!-- #region マップ確認 -->

<div
    id="mapModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-title">
            送迎ルート確認
        </div>


        <div class="modal-text">
            以下の順番でGoogleマップを開きます。
        </div>


        <div
            id="routePreview"
            class="route-preview"
        ></div>


        <div class="modal-buttons">

            <button
                id="cancelMapButton"
                class="secondary"
                type="button"
            >
                キャンセル
            </button>


            <button
                id="startMapButton"
                class="primary"
                type="button"
            >
                案内開始
            </button>

        </div>

    </div>

</div>

<!-- #endregion -->


<script>


// #region データ

const DAYS = [
    "mon",
    "tue",
    "wed",
    "thu",
    "fri",
    "sat"
];


let currentDay = "mon";


let store = {
    users: [],

    mon:{origin:"",route:[]},
    tue:{origin:"",route:[]},
    wed:{origin:"",route:[]},
    thu:{origin:"",route:[]},
    fri:{origin:"",route:[]},
    sat:{origin:"",route:[]}
};


let mapURL = "";


const $ = id =>
    document.getElementById(id);


const createID = () => {

    if(
        window.crypto &&
        typeof crypto.randomUUID === "function"
    ){
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .substring(2)
    );

};


// #endregion



// #region 保存

function save(){

    store[currentDay].origin =
        $("originInput").value;


    localStorage.setItem(
        "app_data",
        JSON.stringify(store)
    );


    localStorage.setItem(
        "app_day",
        currentDay
    );

}


function load(){

    const saved =
        localStorage.getItem("app_data");


    if(saved){

        try{

            const parsed =
                JSON.parse(saved);


            if(
                parsed &&
                typeof parsed === "object"
            ){

                store = normalize(parsed);

            }

        }catch(error){

            console.error(
                "保存データ読み込みエラー",
                error
            );

        }

    }


    const savedDay =
        localStorage.getItem("app_day");


    if(
        DAYS.includes(savedDay)
    ){

        currentDay =
            savedDay;

    }

}


function normalize(data){

    const result = {

        users:
            Array.isArray(data.users)
                ? data.users
                : [],

        mon:{
            origin:data.mon?.origin || "",
            route:Array.isArray(data.mon?.route)
                ? data.mon.route.map(String)
                : []
        },

        tue:{
            origin:data.tue?.origin || "",
            route:Array.isArray(data.tue?.route)
                ? data.tue.route.map(String)
                : []
        },

        wed:{
            origin:data.wed?.origin || "",
            route:Array.isArray(data.wed?.route)
                ? data.wed.route.map(String)
                : []
        },

        thu:{
            origin:data.thu?.origin || "",
            route:Array.isArray(data.thu?.route)
                ? data.thu.route.map(String)
                : []
        },

        fri:{
            origin:data.fri?.origin || "",
            route:Array.isArray(data.fri?.route)
                ? data.fri.route.map(String)
                : []
        },

        sat:{
            origin:data.sat?.origin || "",
            route:Array.isArray(data.sat?.route)
                ? data.sat.route.map(String)
                : []
        }

    };


    result.users =
        result.users.map(user => ({

            id:String(user.id),

            name:String(user.name || ""),

            address:String(user.address || ""),

            days:
                Array.isArray(user.days)
                    ? user.days
                    : []

        }));


    return result;

}

// #endregion



// #region 画面表示

function render(){

    const dayData =
        store[currentDay];


    $("originInput").value =
        dayData.origin || "";


    document
        .querySelectorAll(".nav button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.day === currentDay
            );

        });


    /*
     * 現在曜日の利用者
     */
    const todayUsers =
        store.users.filter(user =>
            user.days.includes(currentDay)
        );


    /*
     * 待機
     */
    const poolUsers =
        todayUsers.filter(user =>
            !dayData.route.includes(user.id)
        );


    renderPool(poolUsers);


    /*
     * ルート
     */
    const routeUsers =
        dayData.route
            .map(id =>
                store.users.find(
                    user => user.id === id
                )
            )
            .filter(Boolean);


    renderRoute(routeUsers);

}


function renderPool(users){

    const pool =
        $("userPool");


    pool.innerHTML = "";


    if(!users.length){

        pool.innerHTML =
            `<div class="empty">
                待機中の利用者はいません
            </div>`;

        return;

    }


    users.forEach(user => {

        pool.appendChild(
            createUserItem(
                user,
                true
            )
        );

    });

}


function renderRoute(users){

    const route =
        $("routeList");


    route.innerHTML = "";


    if(!users.length){

        route.innerHTML =
            `<div class="empty">
                送迎ルートに利用者がいません
            </div>`;

        return;

    }


    users.forEach(user => {

        route.appendChild(
            createUserItem(
                user,
                false
            )
        );

    });

}


function createUserItem(
    user,
    waiting
){

    const item =
        document.createElement("div");


    item.className =
        "item";


    item.dataset.id =
        user.id;


    item.innerHTML = `

        <div class="info">

            <span class="name">
                ${escapeHTML(user.name)}
            </span>

            <span class="address">
                ${escapeHTML(user.address)}
            </span>

        </div>


        <div class="actions">

            <button
                type="button"
                class="icon move"
            >
                ${waiting ? "+" : "−"}
            </button>


            <button
                type="button"
                class="icon delete"
            >
                ×
            </button>


            ${
                waiting
                    ? ""
                    : `<span class="drag">
                        ☰
                    </span>`
            }

        </div>
    `;


    item
        .querySelector(".move")
        .addEventListener(
            "click",
            () => {

                if(waiting){

                    addToRoute(user.id);

                }else{

                    removeFromRoute(user.id);

                }

            }
        );


    item
        .querySelector(".delete")
        .addEventListener(
            "click",
            () => {

                deleteUser(user.id);

            }
        );


    return item;

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            char => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[char])
        );

}

// #endregion



// #region 利用者

function addToRoute(id){

    const route =
        store[currentDay].route;


    if(
        route.includes(id)
    ){
        return;
    }


    route.push(id);


    save();

    render();

}


function removeFromRoute(id){

    store[currentDay].route =
        store[currentDay].route.filter(
            routeID =>
                routeID !== id
        );


    save();

    render();

}


function deleteUser(id){

    const user =
        store.users.find(
            user => user.id === id
        );


    if(!user){
        return;
    }


    if(
        !confirm(
            `「${user.name}」を削除しますか？`
        )
    ){
        return;
    }


    store.users =
        store.users.filter(
            user => user.id !== id
        );


    DAYS.forEach(day => {

        store[day].route =
            store[day].route.filter(
                routeID =>
                    routeID !== id
            );

    });


    save();

    render();

}


$("addButton")
    .addEventListener(
        "click",
        () => {

            const name =
                $("newName")
                    .value
                    .trim();


            const address =
                $("newAddress")
                    .value
                    .trim();


            const days =
                Array.from(
                    document.querySelectorAll(
                        'input[name="regDay"]:checked'
                    )
                ).map(
                    checkbox =>
                        checkbox.value
                );


            if(!name || !address){

                alert(
                    "氏名と住所を入力してください。"
                );

                return;

            }


            if(!days.length){

                alert(
                    "曜日を選択してください。"
                );

                return;

            }


            store.users.push({

                id:createID(),

                name:name,

                address:address,

                days:days

            });


            $("newName").value = "";

            $("newAddress").value = "";


            save();

            render();

        }
    );


$("clearRouteButton")
    .addEventListener(
        "click",
        () => {

            store[currentDay].route = [];

            save();

            render();

        }
    );


// #endregion



// #region 曜日

document
    .querySelectorAll(".nav button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                save();


                currentDay =
                    button.dataset.day;


                render();

            }
        );

    });

// #endregion



// #region GPS

$("gpsButton")
    .addEventListener(
        "click",
        () => {

            if(
                !navigator.geolocation
            ){

                alert(
                    "この端末ではGPSを利用できません。"
                );

                return;

            }


            $("originInput").value =
                "取得中...";


            navigator.geolocation
                .getCurrentPosition(

                    position => {

                        $("originInput").value =
                            `${position.coords.latitude},${position.coords.longitude}`;

                        save();

                    },

                    error => {

                        console.error(
                            error
                        );

                        $("originInput").value = "";

                        alert(
                            "GPSの取得に失敗しました。"
                        );

                    },

                    {
                        enableHighAccuracy:true,
                        timeout:10000,
                        maximumAge:0
                    }

                );

        }
    );


$("originInput")
    .addEventListener(
        "input",
        save
    );

// #endregion



// #region マップ

/*
 * GoogleマップURLを作る
 */
function createMapURL(){

    const route =
        store[currentDay].route;


    if(!route.length){

        alert(
            "送迎ルートに利用者がいません。"
        );

        return null;

    }


    const origin =
        $("originInput")
            .value
            .trim();


    if(!origin){

        alert(
            "出発地点を入力してください。"
        );

        return null;

    }


    const users =
        route
            .map(id =>
                store.users.find(
                    user => user.id === id
                )
            )
            .filter(Boolean);


    if(!users.length){

        alert(
            "ルートの利用者情報を取得できません。"
        );

        return null;

    }


    const addresses =
        users.map(
            user => user.address
        );


    /*
     * Google Maps Directions API URL
     */
    let url =
        "https://www.google.com/maps/dir/?api=1";


    url +=
        "&origin=" +
        encodeURIComponent(origin);


    url +=
        "&destination=" +
        encodeURIComponent(
            addresses[
                addresses.length - 1
            ]
        );


    url +=
        "&travelmode=driving";


    /*
     * 途中の利用者
     */
    if(
        addresses.length > 1
    ){

        const waypoints =
            addresses
                .slice(0,-1)
                .map(
                    address =>
                        encodeURIComponent(
                            address
                        )
                )
                .join("|");


        url +=
            "&waypoints=" +
            waypoints;

    }


    return url;

}


/*
 * マップボタン
 *
 * ここでは「確認画面」を表示するだけ。
 */
$("mapButton")
    .addEventListener(
        "click",
        () => {

            const route =
                store[currentDay].route;


            if(!route.length){

                alert(
                    "送迎ルートに利用者がいません。"
                );

                return;

            }


            const origin =
                $("originInput")
                    .value
                    .trim();


            if(!origin){

                alert(
                    "出発地点を入力してください。"
                );

                return;

            }


            const users =
                route
                    .map(id =>
                        store.users.find(
                            user =>
                                user.id === id
                        )
                    )
                    .filter(Boolean);


            const names =
                users.map(
                    user => user.name
                );


            $("routePreview")
                .textContent =
                    `[起点] ${origin} → ` +
                    names.join(" → ");


            mapURL =
                createMapURL();


            if(!mapURL){
                return;
            }


            $("mapModal")
                .classList
                .add("active");

        }
    );


/*
 * キャンセル
 */
$("cancelMapButton")
    .addEventListener(
        "click",
        () => {

            $("mapModal")
                .classList
                .remove("active");

        }
    );


/*
 * ★ 案内開始
 *
 * window.open()は使わない。
 *
 * location.hrefで直接Googleマップへ移動する。
 */
$("startMapButton")
    .addEventListener(
        "click",
        () => {

            if(!mapURL){

                alert(
                    "マップのURLを作成できませんでした。"
                );

                return;

            }


            /*
             * 画面遷移
             */
            window.location.assign(
                mapURL
            );

        }
    );


/*
 * モーダル外側をクリック
 */
$("mapModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                $("mapModal")
            ){

                $("mapModal")
                    .classList
                    .remove("active");

            }

        }
    );


// #endregion



// #region 起動

load();

render();

// #endregion


</script>

</body>
</html>
