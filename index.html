<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>送迎ルート管理 - Professional Edition</title>

    <link rel="icon" type="image/png" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23090d16%22 stroke=%22%2338bdf8%22 stroke-width=%222%22/%3E%3Cpath d=%22M18 46V18h10c9 0 14 4 14 13s-5 13-14 13H18zm7-6h3c4 0 7-2 7-7s-3-7-7-7h-3v14z%22 fill=%22%2338bdf8%22/%3E%3C/svg%3E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ルート管理">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-base: #07090e;
            --bg-gradient: linear-gradient(135deg, #07090e 0%, #111827 100%);
            --surface-glass: rgba(19, 27, 46, 0.7);
            --surface-solid: #131b2e;
            --surface-hover: rgba(56, 189, 248, 0.08);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(56, 189, 248, 0.5);
            --danger: #f43f5e;
            --danger-glow: rgba(244, 63, 94, 0.25);
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --nav-height: 76px;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-base);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
            padding-bottom: calc(var(--nav-height) + 32px);
        }

        .app-container {
            max-width: 460px;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px 8px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--border-focus);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin: 14px 0;
        }

        .day-option {
            position: relative;
            cursor: pointer;
            text-align: center;
        }

        .day-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .day-option span {
            display: block;
            padding: 10px 0;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .day-option input:checked + span {
            background: var(--primary);
            color: var(--bg-base);
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
            border-radius: var(--radius-sm);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, filter 0.2s ease, background 0.2s ease;
        }

        button:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: var(--bg-base);
            padding: 13px 16px;
            width: 100%;
            font-size: 0.95rem;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            padding: 0 14px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }

        .btn-text {
            background: transparent;
            color: var(--primary);
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .list-zone {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 60px;
        }

        #userPool {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        .item-card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        #userPool .item-card {
            width: auto;
            flex: 1 1 130px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
        }

        #userPool .item-card .item-address,
        #userPool .item-card .drag-handle {
            display: none !important;
        }

        .item-card.sortable-drag {
            background: #1e293b;
            border-color: var(--primary);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6);
            transform: scale(1.02);
        }

        .item-card.sortable-ghost {
            opacity: 0.2;
            background: transparent;
            border: 2px dashed var(--primary);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            padding-right: 8px;
        }

        .item-name {
            font-size: 0.92rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-address {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .action-btn.map:hover {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .action-btn.danger:hover {
            background: var(--danger-glow);
            color: var(--danger);
            border-color: rgba(244, 63, 94, 0.3);
        }

        .drag-handle {
            color: var(--text-muted);
            cursor: grab;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .drag-handle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px env(safe-area-inset-bottom);
            z-index: 100;
        }

        .nav-tab {
            flex: 1;
            height: 100%;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-radius: 0;
            transition: color 0.2s;
        }

        .nav-tab.active {
            color: var(--primary);
        }

        .nav-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: transparent;
            box-shadow: 0 0 8px var(--primary);
        }

        .nav-tab.active .nav-dot {
            background: var(--primary);
        }

        .btn-map-action {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 5, 8, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--surface-solid);
            width: 88%;
            max-width: 340px;
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transform: scale(0.95);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--text-main);
            margin-top: 8px;
            word-break: break-all;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header>
            <div class="header-brand">
                <div class="brand-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
                </div>
                <h1>送迎ルート管理</h1>
            </div>
        </header>

        <!-- 登録セクション -->
        <div class="card">
            <div class="section-header">
                <span class="section-title">起点・利用者マスター登録</span>
            </div>

            <div class="input-row">
                <input type="text" id="originInput" placeholder="本日の出発地点（住所またはGPS）">
                <button type="button" class="btn-secondary" id="gpsBtn">GPS</button>
            </div>

            <div style="border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;">
                <div class="input-row">
                    <input type="text" id="newName" placeholder="氏名">
                    <input type="text" id="newAddress" placeholder="住所">
                </div>

                <div class="day-selector">
                    <label class="day-option"><input type="checkbox" name="regDay" value="mon"><span>月</span></label>
                    <label class="day-option"><input type="checkbox" name="regDay" value="tue"><span>火</span></label>
                    <label class="day-option"><input type="checkbox" name="regDay" value="wed"><span>水</span></label>
                    <label class="day-option"><input type="checkbox" name="regDay" value="thu"><span>木</span></label>
                    <label class="day-option"><input type="checkbox" name="regDay" value="fri"><span>金</span></label>
                    <label class="day-option"><input type="checkbox" name="regDay" value="sat"><span>土</span></label>
                </div>

                <button type="button" class="btn-primary" id="addMasterBtn">マスターに登録</button>
            </div>
        </div>

        <!-- 待機プール -->
        <div>
            <div class="section-header">
                <span class="section-title">本日の利用者（待機中）</span>
            </div>
            <div id="userPool" class="list-zone"></div>
        </div>

        <!-- ルート順序 -->
        <div>
            <div class="section-header">
                <span class="section-title">本日の送迎ルート順序</span>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button type="button" class="btn-map-action" id="openMapModalBtn">マップ案内</button>
                    <button type="button" class="btn-text" id="clearRouteBtn">一括解除</button>
                </div>
            </div>
            <div id="routeList" class="list-zone"></div>
        </div>
    </div>

    <!-- 曜日切り替えナビ -->
    <nav class="bottom-nav">
        <button class="nav-tab active" data-day="mon">月<div class="nav-dot"></div></button>
        <button class="nav-tab" data-day="tue">火<div class="nav-dot"></div></button>
        <button class="nav-tab" data-day="wed">水<div class="nav-dot"></div></button>
        <button class="nav-tab" data-day="thu">木<div class="nav-dot"></div></button>
        <button class="nav-tab" data-day="fri">金<div class="nav-dot"></div></button>
        <button class="nav-tab" data-day="sat">土<div class="nav-dot"></div></button>
    </nav>

    <!-- モーダル -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-card">
            <div class="modal-title">Googleマップ案内</div>
            <div class="modal-desc">
                設定された経路でマップを起動します。
                <div class="modal-box" id="modalRouteSummary"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="closeModalBtn" style="flex:1; padding: 12px;">キャンセル</button>
                <button type="button" class="btn-primary" id="launchMapBtn" style="flex:1; padding: 12px;">ナビ開始</button>
            </div>
        </div>
    </div>

    <script>
        const APP_VERSION = 'v24_single_map_support';
        const VALID_DAYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const $ = id => document.getElementById(id);

        let currentDay = 'mon';
        let store = {
            users: [],
            mon: { origin: '', route: [] },
            tue: { origin: '', route: [] },
            wed: { origin: '', route: [] },
            thu: { origin: '', route: [] },
            fri: { origin: '', route: [] },
            sat: { origin: '', route: [] }
        };

        const sanitize = str => {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        };

        const loadState = () => {
            try {
                const ver = localStorage.getItem('app_ver');
                const data = localStorage.getItem('app_store');
                const day = localStorage.getItem('app_day');

                if (ver === APP_VERSION && data) {
                    const parsed = JSON.parse(data);
                    if (parsed && typeof parsed === 'object') {
                        store.users = Array.isArray(parsed.users) ? parsed.users : [];
                        VALID_DAYS.forEach(d => {
                            if (parsed[d]) {
                                store[d].origin = typeof parsed[d].origin === 'string' ? parsed[d].origin : '';
                                store[d].route = Array.isArray(parsed[d].route) ? parsed[d].route.map(String) : [];
                            }
                        });
                    }
                }
                if (VALID_DAYS.includes(day)) currentDay = day;
            } catch (e) {
                console.error('State load error:', e);
            }
        };

        const saveState = () => {
            store[currentDay].origin = $('originInput').value;
            localStorage.setItem('app_ver', APP_VERSION);
            localStorage.setItem('app_store', JSON.stringify(store));
            localStorage.setItem('app_day', currentDay);
        };

        const render = () => {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.day === currentDay);
            });

            document.querySelectorAll('input[name="regDay"]').forEach(cb => {
                cb.checked = (cb.value === currentDay);
            });

            const dayData = store[currentDay];
            $('originInput').value = dayData.origin;

            const poolContainer = $('userPool');
            const routeContainer = $('routeList');
            poolContainer.innerHTML = '';
            routeContainer.innerHTML = '';

            const poolUsers = store.users.filter(u => u.days.includes(currentDay) && !dayData.route.includes(u.id));
            poolUsers.forEach(u => poolContainer.appendChild(createCard(u, true)));

            const routeUsers = dayData.route.map(id => store.users.find(u => u.id === id)).filter(Boolean);
            routeUsers.forEach(u => routeContainer.appendChild(createCard(u, false)));
        };

        const createCard = (user, isPool) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.dataset.id = user.id;

            const iconAdd = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`;
            const iconRemove = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            const iconMap = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`;
            const iconTrash = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
            const iconDrag = `<svg viewBox="0 0 24 24"><path d="M3 15h18v-2H3v2zm0 4h18v-2H3v2zm0-8h18V9H3v2zm0-6v2h18V5H3z"/></svg>`;

            card.innerHTML = `
                <div class="item-info">
                    <span class="item-name">${sanitize(user.name)}</span>
                    <span class="item-address">${sanitize(user.address)}</span>
                </div>
                <div class="item-actions">
                    <button type="button" class="action-btn map btn-single-map" title="この場所をマップで表示">
                        ${iconMap}
                    </button>
                    <button type="button" class="action-btn btn-toggle" title="${isPool ? '追加' : '解除'}">
                        ${isPool ? iconAdd : iconRemove}
                    </button>
                    <button type="button" class="action-btn danger btn-delete" title="削除">
                        ${iconTrash}
                    </button>
                    ${isPool ? '' : `<div class="drag-handle" title="並び替え">${iconDrag}</div>`}
                </div>
            `;
            return card;
        };

        document.addEventListener('click', e => {
            const card = e.target.closest('.item-card');
            if (!card) return;
            const id = card.dataset.id;

            // 単体マップ表示
            if (e.target.closest('.btn-single-map')) {
                const user = store.users.find(u => u.id === id);
                if (user && user.address) {
                    const singleUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(user.address)}`;
                    window.location.href = singleUrl;
                }
                return;
            }

            if (e.target.closest('.btn-toggle')) {
                const route = store[currentDay].route;
                const idx = route.indexOf(id);
                if (idx === -1) route.push(id);
                else route.splice(idx, 1);
                saveState();
                render();
            }

            if (e.target.closest('.btn-delete')) {
                const user = store.users.find(u => u.id === id);
                if (!user || !confirm(`「${user.name}」のマスター登録を削除しますか？`)) return;
                store.users = store.users.filter(u => u.id !== id);
                VALID_DAYS.forEach(d => {
                    store[d].route = store[d].route.filter(rid => rid !== id);
                });
                saveState();
                render();
            }
        });

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const day = tab.dataset.day;
                if (day === currentDay) return;
                saveState();
                currentDay = day;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        $('addMasterBtn').addEventListener('click', () => {
            const name = $('newName').value.trim();
            const address = $('newAddress').value.trim();
            const days = Array.from(document.querySelectorAll('input[name="regDay"]:checked')).map(cb => cb.value);

            if (!name || !address) {
                alert('氏名と住所を入力してください');
                return;
            }
            if (days.length === 0) {
                alert('利用曜日を1つ以上選択してください');
                return;
            }

            store.users.push({
                id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2),
                name, address, days
            });

            $('newName').value = '';
            $('newAddress').value = '';
            saveState();
            render();
        });

        $('originInput').addEventListener('input', saveState);

        $('gpsBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('GPS機能がサポートされていません');
                return;
            }
            $('originInput').value = '位置情報を取得中...';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    $('originInput').value = `${pos.coords.latitude},${pos.coords.longitude}`;
                    saveState();
                },
                () => {
                    alert('位置情報の取得に失敗しました');
                    $('originInput').value = '';
                    saveState();
                },
                { enableHighAccuracy: true, timeout: 6000 }
            );
        });

        $('clearRouteBtn').addEventListener('click', () => {
            if (!store[currentDay].route.length) return;
            store[currentDay].route = [];
            saveState();
            render();
        });

        let compiledMapUrl = '';
        const setModalOpen = open => $('mapModal').classList.toggle('active', open);

        $('openMapModalBtn').addEventListener('click', () => {
            const routeIds = store[currentDay].route;
            const origin = $('originInput').value.trim();

            if (!routeIds.length) {
                alert('ルートに利用者が追加されていません');
                return;
            }
            if (!origin) {
                alert('出発地点を入力してください');
                return;
            }

            const users = routeIds.map(id => store.users.find(u => u.id === id)).filter(Boolean);
            const names = users.map(u => u.name);
            const addresses = users.map(u => u.address);

            $('modalRouteSummary').textContent = `[起点] ${origin.includes(',') ? 'GPS現在地' : origin} → ` + names.join(' → ');

            const cleanOrigin = encodeURIComponent(origin);
            const cleanDestination = encodeURIComponent(addresses[addresses.length - 1]);
            
            let url = `https://www.google.com/maps/dir/?api=1&origin=${cleanOrigin}&destination=${cleanDestination}&travelmode=driving`;

            if (addresses.length > 1) {
                const waypoints = addresses.slice(0, -1).map(addr => encodeURIComponent(addr)).join('|');
                url += `&waypoints=${waypoints}`;
            }

            compiledMapUrl = url;
            setModalOpen(true);
        });

        $('closeModalBtn').addEventListener('click', () => setModalOpen(false));
        $('mapModal').addEventListener('click', e => { if (e.target === $('mapModal')) setModalOpen(false); });
        
        $('launchMapBtn').addEventListener('click', () => {
            if (compiledMapUrl) {
                window.location.href = compiledMapUrl;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            render();

            new Sortable($('routeList'), {
                animation: 180,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                delay: 100,
                delayOnTouchOnly: true,
                onEnd: () => {
                    const newIds = Array.from($('routeList').querySelectorAll('.item-card')).map(el => el.dataset.id);
                    store[currentDay].route = newIds;
                    saveState();
                }
            });
        });
    </script>
</body>
</html>
